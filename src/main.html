<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whats Weather ?</title>
  </head>
  <body>
    <header>
      <form class="weather-form">
        <input type="text" aria-label="location" placeholder="London" />
        <button type="submit" aria-label="search" title="search"></button>
      </form>

      <div class="temp-toggle">
        <label>
          <span>&#8457;</span>
          <input type="radio" name="temperature" value="Fahrenheit" />
        </label>

        <label>
          <span>&#8451;</span>
          <input type="radio" name="temperature" value="Celsius" />
        </label>
      </div>
    </header>

    <main class="main-content">
      <div data-loading="false" class="loader"></div>
    </main>
  </body>
</html>
